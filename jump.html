<!-- TDPlay "jump to video" – OPTIONAL, site-wide.
     Hostinger builder → Website settings → Integrations → Custom code → paste into the
     BODY section (end of body), save, publish.

     What it does: when a page is opened from a search result, the URL carries
     ?v=<YouTube id>#<row id>. The browser lands on the row by itself; this script then
     centres the exact video and flashes a red frame around it for a few seconds.
     Without it, search results still land on the correct row – this just makes it exact. -->
<script>
(function () {
  var v; try { v = new URLSearchParams(location.search).get("v"); } catch (e) { return; }
  if (!v || !/^[\w-]{11}$/.test(v)) return;
  var q = 'iframe[src*="/embed/' + v + '"],img[src*="/vi/' + v + '/"],img[src*="/vi_webp/' + v + '/"],source[srcset*="/vi/' + v + '/"],source[srcset*="/vi_webp/' + v + '/"]';
  var tries = 0, done = false;
  function frameFor(video) {
    // Prefer the grey back-plate behind the video (it also wraps the caption).
    var vr = video.getBoundingClientRect(), cx = vr.left + vr.width / 2, cy = vr.top + vr.height / 2;
    var sec = video.closest("section") || document, best = null;
    sec.querySelectorAll('img[src*="back-plate"]').forEach(function (im) {
      var r = im.getBoundingClientRect();
      if (r.width > 0 && cx > r.left && cx < r.right && cy > r.top && cy < r.bottom) best = im;
    });
    return best || video;
  }
  function jump() {
    if (done) return;
    var el = document.querySelector(q);
    var video = el && (el.closest(".layout-element__component") || el.closest(".layout-element"));
    if (!video) { if (++tries < 20) setTimeout(jump, 250); return; }
    done = true;
    var target = frameFor(video);
    target.scrollIntoView({ block: "center", behavior: "smooth" });
    var o = document.createElement("div");
    o.style.cssText = "position:fixed;z-index:2147483000;pointer-events:none;box-sizing:border-box;border-radius:14px;" +
      "border:4px solid #ff2b2b;box-shadow:0 0 0 4px rgba(255,43,43,.45),0 0 44px 16px rgba(255,43,43,.9),inset 0 0 30px rgba(255,43,43,.35);" +
      "transition:opacity .9s ease;opacity:1";
    document.body.appendChild(o);
    var t0 = Date.now();
    (function track() {
      var r = target.getBoundingClientRect(), pad = 10;
      o.style.left = (r.left - pad) + "px"; o.style.top = (r.top - pad) + "px";
      o.style.width = (r.width + 2 * pad) + "px"; o.style.height = (r.height + 2 * pad) + "px";
      var age = Date.now() - t0;
      o.style.borderColor = (Math.floor(age / 350) % 2) ? "#ff8a8a" : "#ff2b2b";   // gentle pulse
      if (age > 4500) o.style.opacity = "0";
      if (age < 5600) requestAnimationFrame(track); else o.remove();
    })();
  }
  if (document.readyState === "complete") setTimeout(jump, 150);
  else window.addEventListener("load", function () { setTimeout(jump, 150); });
})();
</script>
