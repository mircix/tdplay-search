<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDPlay Search</title>
<meta name="description" content="Search every TDPlay page – artists, songs, initials and months.">
<link rel="icon" href="https://tdplay.site/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #000 radial-gradient(ellipse at 50% -20%, #1a1024 0%, #000 60%);
    color: #fff;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* starfield */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .7;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 35% 62%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 44%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 30%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 20% 84%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 66% 76%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 42% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 93% 88%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 50%, #fff 50%, transparent 51%);
    background-size: 700px 500px;
  }
  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  header h1 {
    margin: 0; font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-weight: 600;
    font-size: 44px; letter-spacing: .01em; line-height: 1;
  }
  header h1 em { font-style: normal; color: #ff2b2b; }
  /* glossy black oval button with pink glow – matches the site's title-bar buttons */
  .pill {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 150px; height: 52px; margin: 0 auto 24px; border-radius: 50%;
    text-decoration: none; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(ellipse 70% 55% at 50% 118%, #3a3a3a 0%, rgba(58,58,58,0) 70%),
      radial-gradient(ellipse 100% 100% at 50% 50%, #161616 0%, #0a0a0a 60%, #000 100%);
    border: 1px solid #2c2c2c;
    box-shadow: 0 5px 14px rgba(0,0,0,.85), 0 0 0 1px #000,
                inset 0 -4px 9px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.14);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .pill::before {                                  /* top glass reflection */
    content: ""; position: absolute; left: 9%; right: 9%; top: 5%; height: 46%;
    border-radius: 50%; z-index: -1;
    background: linear-gradient(to bottom, rgba(255,255,255,.24), rgba(255,255,255,.06) 65%, rgba(255,255,255,0));
  }
  .pill span {
    font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-weight: 600; font-size: 21px;
    letter-spacing: .01em; line-height: 1; color: #ff74c4; white-space: nowrap;
    text-shadow: 0 0 3px #ff3fa8, 0 0 9px #ff1f95, 0 0 18px rgba(255,31,149,.65), 0 1px 0 #6e0a3f;
  }
  .pill:hover { box-shadow: 0 5px 14px rgba(0,0,0,.85), 0 0 0 1px #000, 0 0 14px rgba(255,31,149,.35),
                            inset 0 -4px 9px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.18); }
  .pill:hover span { color: #ff8fd0; text-shadow: 0 0 4px #ff4fb0, 0 0 12px #ff1f95, 0 0 22px rgba(255,31,149,.8), 0 1px 0 #6e0a3f; }
  .pill:active { transform: translateY(1px); }
  footer { position: relative; z-index: 1; text-align: center; color: #6c6c78; font-size: 12.5px; padding: 0 18px 30px; }
  footer a { color: #9a9aa8; }
</style>
</head>
<body>
<main>
  <a class="pill" href="https://tdplay.site/" aria-label="Back to tdplay.site"><span>Back to Site</span></a>
  <header>
    <h1>TDPlay <em>Search</em></h1>
  </header>
  <div id="tdplay-search"></div>
</main>
<footer>Index rebuilds automatically from <a href="https://tdplay.site/sitemap.xml">tdplay.site/sitemap.xml</a>, so new pages appear on their own.</footer>
<script src="search.js"></script>
</body>
</html>
